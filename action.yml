name: "Repo360"
description: "360-Degree Platform Governance, Compliance, and Engineering Intelligence for GitHub Organizations."
author: "Repo360 Engineering Team"

inputs:
  app_id:
    description: "GitHub App numeric ID"
    required: true
  private_key:
    description: "GitHub App RSA private key (.pem string)"
    required: true
  installation_id:
    description: "GitHub App Installation ID (optional: auto-discovered across all organizations if omitted)"
    required: false
    default: ""
  api_base_url:
    description: "GitHub API Base URL: https://api.github.com for GitHub.com, https://api.<enterprise>.ghe.com for ghe.com, or https://ghe.company.com/api/v3 for GHES."
    required: false
    default: "https://api.github.com"
  advisory_config:
    description: "Path to custom advisory policy JSON (optional: uses built-in defaults if omitted)"
    required: false
    default: ""
  inventory:
    description: "Path to repository inventory CSV (optional: audits all accessible repos if omitted)"
    required: false
    default: ""
  org:
    description: "Optional comma-separated list of organizations to audit (e.g. 'org1,org2'). Audits all installed organizations if omitted."
    required: false
    default: ""
  output_dir:
    description: "Directory to save generated Excel, CSV, and HTML reports"
    required: false
    default: "./repo360-output"
  upload_artifact:
    description: "Automatically upload generated reports (.xlsx, .csv, .html) as a workflow artifact"
    required: false
    default: "true"
  artifact_name:
    description: "Name of the uploaded workflow artifact"
    required: false
    default: "repo360-audit-reports"
  artifact_retention_days:
    description: "Duration (in days) to retain the uploaded artifact"
    required: false
    default: "60"
  ai_api_key:
    description: "Unified AI API key for any provider (Google Gemini, OpenAI, Anthropic)"
    required: false
    default: ""
  ai_model:
    description: "Optional AI model identifier (e.g. 'gemini-3.5-flash', 'gpt-4o', 'claude-3-5-sonnet-20241022'). Provider is auto-detected from model name."
    required: false
    default: "gemini-3.5-flash"
  collect_activity:
    description: "Collect user activity and contributor metrics ('true' or 'false')"
    required: false
    default: "false"
  collect_runners:
    description: "Collect Actions self-hosted runner fleet metrics ('true' or 'false')"
    required: false
    default: "false"
  lookback_days:
    description: "Lookback window in days for user activity and runner metrics"
    required: false
    default: "90"
  # Legacy backward-compatibility inputs
  gemini_api_key:
    description: "Legacy alias for ai_api_key"
    required: false
    default: ""
  openai_api_key:
    description: "Legacy alias for ai_api_key"
    required: false
    default: ""
  anthropic_api_key:
    description: "Legacy alias for ai_api_key"
    required: false
    default: ""
  llm_api_key:
    description: "Legacy alias for ai_api_key"
    required: false
    default: ""
  llm_provider:
    description: "Legacy provider override ('gemini', 'openai', 'anthropic')"
    required: false
    default: ""
  llm_model:
    description: "Legacy alias for ai_model"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Set up Python Environment"
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: "Install Repo360"
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"

    - name: "Execute Repo360 Audit"
      shell: bash
      env:
        REPO360_APP_ID: ${{ inputs.app_id }}
        REPO360_APP_PRIVATE_KEY: ${{ inputs.private_key }}
        REPO360_APP_INSTALLATION_ID: ${{ inputs.installation_id }}
        REPO360_API_BASE_URL: ${{ inputs.api_base_url }}
        AI_API_KEY: ${{ inputs.ai_api_key || inputs.gemini_api_key || inputs.openai_api_key || inputs.anthropic_api_key || inputs.llm_api_key }}
        AI_MODEL: ${{ inputs.ai_model || inputs.llm_model }}
        AI_PROVIDER: ${{ inputs.llm_provider }}
      run: |
        CMD="repo360 audit --output-dir ${{ inputs.output_dir }}"
        if [ -n "${{ inputs.org }}" ]; then
          CMD="$CMD --org ${{ inputs.org }}"
        fi
        if [ -n "${{ inputs.advisory_config }}" ]; then
          CMD="$CMD --advisory-config ${{ inputs.advisory_config }}"
        fi
        if [ -n "${{ inputs.inventory }}" ]; then
          CMD="$CMD --inventory ${{ inputs.inventory }}"
        fi
        eval $CMD

        if [ "${{ inputs.collect_activity }}" = "true" ]; then
          ACT_CMD="repo360 activity --output-dir ${{ inputs.output_dir }} --lookback-days ${{ inputs.lookback_days }}"
          if [ -n "${{ inputs.inventory }}" ]; then
            ACT_CMD="$ACT_CMD --repos ${{ inputs.inventory }}"
          fi
          eval $ACT_CMD
        fi

        if [ "${{ inputs.collect_runners }}" = "true" ]; then
          RUN_CMD="repo360 runners --output-dir ${{ inputs.output_dir }} --lookback-days ${{ inputs.lookback_days }}"
          if [ -n "${{ inputs.inventory }}" ]; then
            RUN_CMD="$RUN_CMD --repos ${{ inputs.inventory }}"
          fi
          eval $RUN_CMD
        fi

    - name: "Publish Audit Reports Artifact"
      if: always() && inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.output_dir }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: ignore
