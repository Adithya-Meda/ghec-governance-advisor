name: "GH Governance Advisory Audit"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Weekly: Mondays at 06:00 UTC

permissions:
  contents: read

jobs:
  governance-audit:
    name: "Execute Advisory Audit"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Run Governance Advisor Action"
        uses: ./
        with:
          app_id: ${{ vars.GHEC_APP_ID }}
          private_key: ${{ secrets.GHEC_APP_PRIVATE_KEY }}
          installation_id: ${{ vars.GHEC_APP_INSTALLATION_ID }}
          api_base_url: ${{ vars.GHEC_API_BASE_URL || 'https://api.github.com' }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          llm_model: ${{ vars.LLM_MODEL || 'gemini-3.5-flash' }}
          output_dir: "./output"

      - name: "Publish Audit Reports Artifact"
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: ghec-governance-audit-reports
          path: |
            output/*.xlsx
            output/*.csv
            output/*.html
          retention-days: 60
